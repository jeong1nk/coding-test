name: Move LeetHub files to subfolder

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정

jobs:
  move-files:
    runs-on: ubuntu-latest
    # 무한 루프 방지: Actions가 스스로 커밋한 경우 실행하지 않음
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move new problem folders
        run: |
          # 1. 잘못 들어간 프로그래머스 폴더를 다시 바깥(루트)으로 이동
          if [ -d "LeetCode/프로그래머스" ]; then
            git mv "LeetCode/프로그래머스" ./
          fi

          # 2. 앞으로 올라올 LeetCode 문제(숫자-영문)만 이동
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"
          for dir in */; do
            dir=${dir%/}
            if [[ "$dir" =~ ^[0-9]+-[a-z0-9-]+$ ]]; then
              git mv "$dir" "$TARGET_DIR/"
            fi
          done


      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Move files to LeetCode folder [skip ci]"
            git push
          fi
