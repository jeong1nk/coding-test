name: Move LeetHub files to subfolder

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정

jobs:
  move-files:
    runs-on: ubuntu-latest
    # 무한 루프 방지: Actions가 스스로 커밋한 경우 실행하지 않음
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move new problem folders
        run: |
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"

          # 루트에 있는 폴더 중 숨김 폴더(.github 등)와 대상 폴더를 제외하고 이동
          for dir in */; do
            dir=${dir%/}
            if [[ "$dir" != "$TARGET_DIR" && "$dir" != .* ]]; then
              git mv "$dir" "$TARGET_DIR/"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Move files to LeetCode folder [skip ci]"
            git push
          fi
