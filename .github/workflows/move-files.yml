name: Move LeetHub files to subfolder

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정

jobs:
  move-files:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move new problem folders
        run: |
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"

          # 1. 잘못 들어간 폴더들을 다시 바깥(루트)으로 원위치
          for folder in "프로그래머스" "SWEA" "백준"; do
            if [ -d "$TARGET_DIR/$folder" ]; then
              git mv "$TARGET_DIR/$folder" ./
            fi
          done

          # 2. 앞으로 올라올 LeetCode 문제(숫자-영문)만 이동
          for dir in */; do
            dir=${dir%/}
            if [[ "$dir" =~ ^[0-9]+-[a-z0-9-]+$ ]]; then
              git mv "$dir" "$TARGET_DIR/"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Restore folders and move LeetCode files [skip ci]"
            git push
          fi
