name: Move LeetHub files to subfolder

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정

jobs:
  move-files:
    runs-on: ubuntu-latest
    # 무한 루프 방지: Actions가 스스로 커밋한 경우 실행하지 않음
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move new problem folders
        run: |
          TARGET_DIR="LeetCode"
          mkdir -p "$TARGET_DIR"

          for dir in */; do
            dir=${dir%/}
            # 폴더 이름이 '숫자-소문자영문/숫자' 형태(예: 0001-two-sum)일 때만 이동
            if [[ "$dir" =~ ^[0-9]+-[a-z0-9-]+$ ]]; then
              git mv "$dir" "$TARGET_DIR/"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Move files to LeetCode folder [skip ci]"
            git push
          fi
